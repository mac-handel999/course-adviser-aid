<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign in — Advyza</title>
  <link rel="icon" type="image/png" href="assets/advyza-favicon.png">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/landing.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
</head>

<body>

  <header class="site-header">
    <div class="wrap">
      <a class="brand-mark" href="index.html">
        <img src="assets/advyza-logo.svg" alt="" class="crest-img">
        <span class="brand-text"><span>Advyza</span><small>Results &amp; transcripts for course advisers</small></span>
      </a>
      <nav class="main-nav" id="mainNav">
        <a href="index.html#features">Features</a>
        <a href="index.html#how-it-works">How it works</a>
        <a href="app.html">Launch app</a>
      </nav>
      <div class="nav-actions">
        <button class="mobile-toggle" id="mobileToggle" aria-label="Toggle menu">&#9776;</button>
      </div>
    </div>
  </header>

  <div class="auth-wrap">
    <div class="auth-card">
      <h2 id="authTitle">Sign in</h2>
      <p class="sub" id="authSub">Access your department result records.</p>

      <form id="authForm">
        <label for="email">Email</label>
        <input type="email" id="email" required placeholder="you@futo.edu.ng">
        <label for="password">Password</label>
        <div class="password-wrap">
          <input type="password" id="password" required placeholder="••••••••">
          <button type="button" class="password-toggle" aria-label="Toggle password visibility">
            <svg viewBox="0 0 24 24"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>
          </button>
        </div>
        <label for="fullName" id="fullNameLabel" style="display:none">Full name</label>
        <input type="text" id="fullName" placeholder="e.g. John Doe" style="display:none">
        <button class="btn gold" type="submit" id="authSubmit">Sign in</button>
      </form>

      <div class="auth-switch">
        <a id="modeToggle">Need an account? Create one</a>
      </div>

      <a class="auth-guest" href="app.html">Continue without an account &rarr;</a>

     
    </div>
  </div>

  <footer class="site-footer">
    <div class="bottom wrap">
      <span id="year"></span> Advyza. Internal results tool.
    </div>
  </footer>

  <script src="js/landing.js"></script>
  <script src="js/supabase-config.js"></script>
  <script src="js/auth.js"></script>
  <script>
    document.querySelectorAll('.password-toggle').forEach(btn => {
      btn.addEventListener('click', () => {
        const input = btn.parentElement.querySelector('input');
        const isPassword = input.type === 'password';
        input.type = isPassword ? 'text' : 'password';
        btn.innerHTML = isPassword
          ? '<svg viewBox="0 0 24 24"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path><line x1="1" y1="1" x2="23" y2="23"></line></svg>'
          : '<svg viewBox="0 0 24 24"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>';
      });
    });
  </script>
</body>

</html>
