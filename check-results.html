<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Check Results — Advyza</title>
  <link rel="icon" type="image/png" href="/assets/advyza-favicon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,400;8..60,600;8..60,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/base.css">
  <link rel="stylesheet" href="/css/check-results.css">
  <script src="/js/grading.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/exceljs@4.3.0/dist/exceljs.min.js"></script>
</head>

<body>
  <div class="check-wrap">
    <div class="check-card">
      <div class="letterhead-check">
        <img src="/assets/futo-logo.jpeg" class="letterhead-logo" alt="FUTO Logo">
        <div class="letterhead-center">
          <h2>FEDERAL UNIVERSITY OF TECHNOLOGY OWERRI</h2>
          <h3 id="checkFaculty">Loading…</h3>
          <p id="checkDepartment">Loading…</p>
          <div class="title-row">STUDENT RESULTS PORTAL</div>
        </div>
        <img src="/assets/futo-logo.jpeg" class="letterhead-logo" alt="FUTO Logo">
      </div>

      <form id="checkForm" class="check-form" novalidate>
        <div id="step1" class="step">
          <div class="field">
            <label for="passcode">Passcode</label>
            <div class="password-wrap">
              <input type="password" id="passcode" required placeholder="Enter passcode">
              <button type="button" class="password-toggle" aria-label="Toggle passcode visibility">
                <svg viewBox="0 0 24 24"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>
              </button>
            </div>
          </div>
          <button class="btn gold" type="button" id="continueBtn">Next: enter registration number</button>
        </div>

        <div id="step2" class="step" style="display:none">
          <div class="field">
            <label for="regNo">Registration / Matric Number</label>
            <input type="text" id="regNo" required placeholder="e.g. PH/2025/001">
          </div>
          <button class="btn gold" type="submit">Check my results</button>
        </div>

        <div id="checkError" class="check-error" role="alert"></div>
      </form>

      <div id="checkResult" class="check-result" style="display:none">
        <div class="watermark">UNOFFICIAL / STUDENT COPY — FOR REFERENCE ONLY</div>
        <div class="result-header">
          <div>
            <div class="hint">Registration Number</div>
            <div class="value" id="resultRegNo"></div>
          </div>
        </div>
        <div id="resultBlocks"></div>
        <div class="cgpa-banner">
          <div>Cumulative Grade Point Average (CGPA)</div>
          <div class="big" id="resultCgpa"></div>
        </div>
        <div class="result-actions">
          <button class="btn secondary" onclick="window.print()">Print / PDF</button>
          <button class="btn gold" id="excelBtn">Export to Excel</button>
        </div>
      </div>
    </div>
  </div>

  <script src="/js/check-results.js"></script>
  <script>
    document.querySelectorAll('.password-toggle').forEach(btn => {
      btn.addEventListener('click', () => {
        const input = btn.parentElement.querySelector('input');
        const isPassword = input.type === 'password';
        input.type = isPassword ? 'text' : 'password';
        btn.innerHTML = isPassword
          ? '<svg viewBox="0 0 24 24"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path><line x1="1" y1="1" x2="23" y2="23"></line></svg>'
          : '<svg viewBox="0 0 24 24"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>';
      });
    });
  </script>
</body>

</html>
