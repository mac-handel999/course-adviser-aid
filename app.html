<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>App — Advyza</title>
  <link rel="icon" type="image/png" href="assets/advyza-favicon.png">
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#0B4432">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/app.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/exceljs@4.3.0/dist/exceljs.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
</head>

<body>

  <div class="app-topbar">
    <a class="left" href="index.html">
      <img src="assets/advyza-logo.svg" alt="" class="crest-sm-img">
      <span>Advyza</span>
    </a>
    <div class="right">
      <span class="user-chip" id="userChip">Not signed in</span>
      <span id="onlineStatus" style="font-size:12px;font-weight:600;"></span>
      <a href="index.html">Home</a>
      <button class="link" onclick="signOut()">Sign out</button>
    </div>
  </div>

  <div id="app">
    <div class="sidebar">
      <div class="sync-status"><span class="dot"></span>Working locally — not synced to the cloud yet</div>
      <div class="nav-group" id="navGroup"></div>
      <div class="account-nav" id="accountNavGroup"></div>
    </div>

    <div class="content">
      <div class="top-actions">
        <button class="btn secondary" onclick="exportAllJSON()">Save data (.json)</button>
        <button class="btn secondary" onclick="document.getElementById('importFile').click()">Load data (.json)</button>
        <input type="file" id="importFile" accept="application/json" style="display:none"
          onchange="importAllJSON(event)">
      </div>
      <div id="reportSettings"></div>
      <div id="viewsContainer"></div>
    </div>
  </div>

  <div class="bottom-tab-bar" id="bottomTabBar">
    <button class="tab" data-view="Transcript" onclick="switchView('Transcript')">
      <svg viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline><line x1="16" y1="13" x2="8" y2="13"></line><line x1="16" y1="17" x2="8" y2="17"></line><polyline points="10 9 9 9 8 9"></polyline></svg>
      <span>Transcript</span>
    </button>
    <button class="tab" data-view="Settings" onclick="switchView('Settings')">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path></svg>
      <span>Settings</span>
    </button>
    <button class="tab" data-view="Profile" onclick="switchView('Profile')">
      <svg viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
      <span>Profile</span>
    </button>
  </div>

  <script src="js/supabase-config.js"></script>
  <script src="js/api-config.js"></script>
  <script src="js/grading.js"></script>
  <script src="js/app.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('/sw.js');
    }
    function updateOnlineStatus() {
      const el = document.getElementById('onlineStatus');
      if (!el) return;
      if (navigator.onLine) {
        el.textContent = 'Online';
        el.style.color = 'var(--ok)';
      } else {
        el.textContent = 'Offline — changes saved locally';
        el.style.color = 'var(--red)';
      }
    }
    window.addEventListener('online', updateOnlineStatus);
    window.addEventListener('offline', updateOnlineStatus);
    updateOnlineStatus();
  </script>
</body>

</html>
