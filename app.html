<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>App — FUTO Public Health Results Portal</title>
  <link rel="icon" href="assets/futo-logo.jpeg" type="image/jpeg">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/app.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/exceljs@4.3.0/dist/exceljs.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
</head>

<body>

  <div class="app-topbar">
    <a class="left" href="index.html">
      <img src="assets/futo-logo.jpeg" alt="" class="crest-sm-img">
      <span>Public Health Results Portal</span>
    </a>
    <div class="right">
      <span class="user-chip" id="userChip">Not signed in</span>
      <a href="index.html">Home</a>
      <button class="link" onclick="signOut()">Sign out</button>
    </div>
  </div>

  <div id="app">
    <div class="sidebar">
      <div class="sync-status"><span class="dot"></span>Working locally — not synced to the cloud yet</div>
      <div class="nav-group" id="navGroup"></div>
    </div>

    <div class="content">
      <div class="top-actions">
        <button class="btn secondary" onclick="exportAllJSON()">Save data (.json)</button>
        <button class="btn secondary" onclick="document.getElementById('importFile').click()">Load data (.json)</button>
        <input type="file" id="importFile" accept="application/json" style="display:none"
          onchange="importAllJSON(event)">
      </div>
      <div id="reportSettings"></div>
      <div id="viewsContainer"></div>
    </div>
  </div>

  <script src="js/supabase-config.js"></script>
  <script src="js/api-config.js"></script>
  <script src="js/app.js"></script>
</body>

</html>
